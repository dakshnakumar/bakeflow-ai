<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Successful - BakeFlow AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: #0c0f17;
            color: #f8fafc;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .success-box {
            background: #141a29;
            border: 1px solid rgba(16, 185, 129, 0.3);
            border-radius: 20px;
            padding: 40px;
            text-align: center;
            max-width: 460px;
            width: 100%;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
        }
        .icon-circle {
            width: 64px;
            height: 64px;
            background: rgba(16, 185, 129, 0.15);
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            margin-bottom: 20px;
            border: 1px solid rgba(16, 185, 129, 0.4);
        }
        h1 {
            font-size: 22px;
            margin-bottom: 10px;
        }
        p {
            font-size: 14px;
            color: #94a3b8;
            line-height: 1.6;
            margin-bottom: 24px;
        }
        .btn-return {
            background: #0070ba;
            color: white;
            text-decoration: none;
            padding: 12px 24px;
            border-radius: 99px;
            font-weight: 700;
            font-size: 14px;
            display: inline-block;
        }
    </style>
</head>
<body>
    <div class="success-box">
        <div class="icon-circle">✅</div>
        <h1>Payment Successful!</h1>
        <p>Thank you! Your payment was verified via PayPal Sandbox Webhooks. The baker's oven schedule and Kitchen Kanban board have been synchronized.</p>
        <a href="/index.html" class="btn-return">← Return to BakeFlow Workspace</a>
    </div>
</body>
</html>
